# vLLM CPU ServingRuntime for x86_64 (amd64) clusters, for OpenShift AI single-model serving (KServe).
# Red Hat's built-in "vLLM CPU" runtime is ppc64le/s390x only. This one uses the upstream x86 image.
# Air-gapped: mirror the image to your own registry first and change `image` below.
#   docker pull vllm/vllm-openai-cpu:v0.32.0-x86_64
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cpu-x86
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: vLLM CPU (x86_64) ServingRuntime for KServe
    opendatahub.io/apiProtocol: REST
    opendatahub.io/template-display-name: vLLM CPU (x86_64) ServingRuntime for KServe
    opendatahub.io/runtime-version: v0.32.0
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: docker.io/vllm/vllm-openai-cpu:v0.32.0-x86_64
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
        - --dtype=bfloat16          # if the CPU has no bf16 support: --dtype=float32
        - --max-model-len=2048
      env:
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /tmp/hf_home
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: VLLM_CACHE_ROOT
          value: /tmp/vllm_cache
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: VLLM_CPU_KVCACHE_SPACE   # KV cache in GiB. Model load needs ~5 GiB RAM, so with an 8Gi limit use 1-2
          value: "1"
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
